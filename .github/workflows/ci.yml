name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: "localhost"
      DB_PORT: 5432
      DB_NAME: "job_scout_db"
      DB_USER: "postgres"
      DB_PASSWORD: "ci-dummy-password"
      GEMINI_API_KEY: "ci-dummy-key"
      GOOGLE_DOCS_TEMPLATE_ID: "ci-dummy-doc-id"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Linters (Ruff)
        run: |
          ruff check .

      - name: Run Test Suite (Pytest)
        run: |
          pytest tests/ -v