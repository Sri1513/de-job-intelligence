name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Linters & Test Suite
    runs-on: ubuntu-latest

    env:
      DB_HOST: "localhost"
      DB_PORT: 5432
      DB_NAME: "job_scout_db"
      DB_USER: "postgres"
      DB_PASSWORD: "ci-dummy-password"
      GEMINI_API_KEY: "ci-dummy-key"
      GOOGLE_DOCS_TEMPLATE_ID: "ci-dummy-doc-id"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Linters (Ruff)
        run: |
          ruff check .

      - name: Run Test Suite (Pytest)
        run: |
          pytest tests/ -v

  deploy:
    name: Deploy to Oracle Cloud VM
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VM and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/projects/de-job-intelligence
            
            echo "Pulling latest code from main..."
            git pull origin main
            
            echo "Rebuilding and restarting updated containers..."
            docker compose up -d --build
            
            echo "Cleaning dangling images..."
            docker image prune -f
            
            echo "Deployment finished successfully!"