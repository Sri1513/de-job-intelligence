[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "de-job-intelligence"
version = "1.0.0"
description = "Autonomous Job Intelligence & Agentic Document Synthesis Engine via Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "fastmcp",
    "google-generativeai",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "jinja2",
    "openai",
    "pandas",
    "psycopg[binary,pool]",
    "pydantic-settings",
    "python-dotenv",
    "python-jobspy",
    "requests",
    "scikit-learn",
    "starlette",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined vars)
    "I",    # isort (import sorting)
]
ignore = [
    "E501", # Line too long
    "W291", # Trailing whitespace (common in multiline SQL queries)
    "W293", # Blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/*" = ["F401", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
