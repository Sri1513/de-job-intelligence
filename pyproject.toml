[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "de-job-intelligence"
version = "1.0.0"
description = "Autonomous Job Intelligence & Agentic Document Synthesis Engine via Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Scraping & Ingestion
    "beautifulsoup4",
    # Pulls directly from GitHub main where markdownify is compatible with browser-use
    "python-jobspy @ https://github.com/speedyapply/JobSpy/archive/refs/heads/main.tar.gz",
    "browser-use>=0.13.10",
    "requests",
    "numpy<2.0.0,>=1.26.3",          # Anchors numpy for python-jobspy

    # AI & MCP Protocols
    "fastmcp",
    "google-generativeai",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "langchain-google-genai>=2.0.0",
    "openai",
    "protobuf<6.0.0,>=4.25.0",       # Prevents Protobuf 6 conflict with google-generativeai
    "grpcio-status<1.75.0",

    # Scoring & Data
    "pandas",
    "scikit-learn",

    # Browser Automation
    "browser-use>=0.13.10",
    "playwright>=1.49.0",

    # Database & Connection Pooling
    "psycopg[binary,pool]>=3.2.0",
    "psycopg-pool>=3.2.0",

    # Web Dashboard & APIs
    "starlette>=0.45.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.5",
    "python-multipart>=0.0.9",

    # Config & Validation
    "pydantic>=2.10.0",
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "deptry>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501", "W291", "W293"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/*" = ["F401", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "uvicorn",
    "jinja2",
    "pandas",
    "langchain-google-genai",
    "protobuf",
    "grpcio-status",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "deptry",
    "numpy",
]