<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Track Job Scout Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-emerald-400">⚡ Multi-Track Job Scout</h1>
                <p class="text-sm text-slate-400">Automated ingestion ledger & viewing command center</p>
            </div>
            <div id="stats" class="text-sm bg-slate-900 border border-slate-800 px-4 py-2 rounded-lg text-slate-300">
                Loading stats...
            </div>
        </header>

        <!-- Category Tabs -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex space-x-3">
                <button onclick="switchCategory('data_engineering')" id="tab-de" class="px-4 py-2 rounded-lg font-semibold text-sm transition-colors bg-emerald-600 text-white shadow-sm">
                    ⚡ Data Engineering
                </button>
                <button onclick="switchCategory('devops')" id="tab-devops" class="px-4 py-2 rounded-lg font-semibold text-sm transition-colors bg-slate-900 text-slate-400 border border-slate-800 hover:text-white">
                    ☁️ DevOps / Cloud
                </button>
            </div>
            <div class="flex items-center gap-2">
                <!-- 🛡️ Autonomous Application Review Gate Link with Dynamic Badge -->
                <a href="/applications" class="px-4 py-2 rounded-lg font-semibold text-sm transition-colors bg-cyan-600 text-white shadow-sm hover:bg-cyan-500 flex items-center gap-2">
                    🛡️ Review Gate
                    <span id="review-gate-badge" class="hidden px-2 py-0.5 rounded-full text-xs font-bold bg-amber-400 text-slate-950 animate-pulse">0</span>
                </a>
                <a href="/whatsapp-alerts" class="px-4 py-2 rounded-lg font-semibold text-sm transition-colors bg-amber-600 text-white shadow-sm hover:bg-amber-500 flex items-center gap-2">
                    📱 WhatsApp Alerts
                </a>
                <a id="audit-btn" href="/audit?category=data_engineering" class="px-4 py-2 rounded-lg font-semibold text-sm transition-colors bg-indigo-600 text-white shadow-sm hover:bg-indigo-500 flex items-center gap-2">
                    🔍 View Skill Audit
                </a>
            </div>
        </div>

        <!-- 🔍 Dashboard Filters Bar -->
        <div class="flex items-center flex-wrap gap-4 mb-6 bg-slate-900 p-4 rounded-xl border border-slate-800">
            <div class="flex items-center space-x-2">
                <label class="text-xs font-semibold text-slate-400">POSTED:</label>
                <select id="filter-posted" onchange="filterAndRenderJobs()" class="bg-slate-950 text-slate-300 border border-slate-700 rounded p-1.5 text-xs outline-none focus:border-blue-500">
                    <option value="all">Any Time</option>
                    <option value="today">Today</option>
                    <option value="past_3_days">Past 3 Days</option>
                    <option value="past_week">Past Week</option>
                </select>
            </div>

            <div class="flex items-center space-x-2">
                <label class="text-xs font-semibold text-slate-400">SWEPT (DB):</label>
                <select id="filter-swept" onchange="filterAndRenderJobs()" class="bg-slate-950 text-slate-300 border border-slate-700 rounded p-1.5 text-xs outline-none focus:border-emerald-500">
                    <option value="all">All Time</option>
                    <option value="today">Swept Today</option>
                    <option value="past_24h">Swept Past 24 Hours</option>
                </select>
            </div>

            <div class="flex items-center space-x-2">
                <label class="text-xs font-semibold text-slate-400">SOURCE:</label>
                <select id="filter-source" onchange="filterAndRenderJobs()" class="bg-slate-950 text-slate-300 border border-slate-700 rounded p-1.5 text-xs outline-none focus:border-indigo-500">
                    <option value="all">All Sources</option>
                    <option value="dice">Dice</option>
                    <option value="indeed">Indeed</option>
                    <option value="linkedin">LinkedIn</option>
                </select>
            </div>
        </div>

        <!-- Job Table Container -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                            <th class="p-4 w-24">Fit Score</th>
                            <th class="p-4 w-1/3">Role & AI Insights</th>
                            <th class="p-4">Location / Type</th>
                            <th class="p-4 w-1/4">Missing Skills</th>
                            <th class="p-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="job-table-body" class="divide-y divide-slate-800/60 text-sm">
                        <tr><td colspan="5" class="p-6 text-center text-slate-500">Loading records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Personal Notes Editing Modal -->
    <div id="notes-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-emerald-400">📝 Edit Personal Notes</h3>
                <button onclick="closeNotesModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
            </div>
            <input type="hidden" id="modal-job-id">
            <textarea id="modal-notes-input" rows="5" class="w-full bg-slate-950 p-3 rounded-xl border border-slate-800 text-slate-200 text-sm outline-none focus:border-emerald-500" placeholder="Type your personal notes here to review in the future..."></textarea>
            <div class="mt-4 flex justify-end gap-2">
                <button onclick="closeNotesModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold">Cancel</button>
                <button onclick="saveJobNotes()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold">Save Notes</button>
            </div>
        </div>
    </div>

    <script>
        let currentCategory = 'data_engineering';
        let allJobs = []; 

        async function fetchJobs(category = 'data_engineering') {
            currentCategory = category;
            
            const deBtn = document.getElementById('tab-de');
            const devopsBtn = document.getElementById('tab-devops');
            
            if (category === 'data_engineering') {
                deBtn.className = "px-4 py-2 rounded-lg font-semibold text-sm transition-colors bg-emerald-600 text-white shadow-sm";
                devopsBtn.className = "px-4 py-2 rounded-lg font-semibold text-sm transition-colors bg-slate-900 text-slate-400 border border-slate-800 hover:text-white";
            } else {
                devopsBtn.className = "px-4 py-2 rounded-lg font-semibold text-sm transition-colors bg-emerald-600 text-white shadow-sm";
                deBtn.className = "px-4 py-2 rounded-lg font-semibold text-sm transition-colors bg-slate-900 text-slate-400 border border-slate-800 hover:text-white";
            }

            const tbody = document.getElementById('job-table-body');
            tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500">Loading ${category.replace('_', ' ')} records...</td></tr>`;

            try {
                const response = await fetch(`/api/jobs?category=${category}`);
                const data = await response.json();
                
                allJobs = Array.isArray(data) ? data : (data.jobs || data.data || []);
                filterAndRenderJobs();
            } catch (err) {
                console.error('Failed to load jobs:', err);
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-400">Error loading job records.</td></tr>`;
            }
        }

        function parseLocalDate(dateStr) {
            if (!dateStr || dateStr === 'Recently' || dateStr === 'N/A') return null;
            if (dateStr.includes('-')) {
                const parts = dateStr.split('T')[0].split('-');
                if (parts.length === 3) {
                    return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                }
            }
            return new Date(dateStr);
        }

        // Formats YYYY-MM-DD into MM-DD-YY
        function formatDateToUS(dateStr) {
            if (!dateStr || dateStr === 'Recently' || dateStr === 'N/A') return dateStr || 'Recently';
            const clean = dateStr.split('T')[0];
            const parts = clean.split('-');
            if (parts.length === 3) {
                const yy = parts[0].substring(2);
                return `${parts[1]}-${parts[2]}-${yy}`; // MM-DD-YY
            }
            return dateStr;
        }

        function formatAppliedTimestamp(timestampStr) {
            if (!timestampStr) return '';
            const clean = timestampStr.split('T')[0];
            const parts = clean.split('-');
            const timePart = timestampStr.includes('T') ? timestampStr.split('T')[1].substring(0, 5) : '';
            if (parts.length === 3) {
                const yy = parts[0].substring(2);
                return `${parts[1]}-${parts[2]}-${yy}${timePart ? ' ' + timePart : ''}`;
            }
            return timestampStr;
        }

        function getDateBadgeClass(dateStr) {
            const d = parseLocalDate(dateStr);
            if (!d || isNaN(d)) return 'bg-slate-800 text-slate-300 border-slate-700';
            const now = new Date();
            const diffHours = (now - d) / (1000 * 60 * 60);

            if (d.toDateString() === now.toDateString()) {
                return 'bg-emerald-950 text-emerald-300 border-emerald-800'; // Green for Today
            } else if (diffHours <= 48) {
                return 'bg-sky-950 text-sky-300 border-sky-800'; // Blue for Yesterday
            } else {
                return 'bg-rose-950 text-rose-300 border-rose-800'; // Red for Older
            }
        }

        function filterAndRenderJobs() {
            const postedVal = document.getElementById('filter-posted').value;
            const sweptVal = document.getElementById('filter-swept').value;
            const sourceVal = document.getElementById('filter-source').value;
            const now = new Date();

            const filtered = allJobs.filter(job => {
                let passesPosted = true;
                if (postedVal !== 'all' && job.date_posted && job.date_posted !== 'Recently' && job.date_posted !== 'N/A') {
                    const postedDate = parseLocalDate(job.date_posted);
                    if (postedDate && !isNaN(postedDate)) {
                        const diffHours = (now - postedDate) / (1000 * 60 * 60);
                        const diffDays = diffHours / 24;
                        
                        if (postedVal === 'today') passesPosted = postedDate.toDateString() === now.toDateString() || diffHours <= 24;
                        else if (postedVal === 'past_3_days') passesPosted = diffDays <= 3;
                        else if (postedVal === 'past_week') passesPosted = diffDays <= 7;
                    } else {
                        passesPosted = false;
                    }
                } else if (postedVal !== 'all') {
                    passesPosted = false; 
                }

                let passesSwept = true;
                if (sweptVal !== 'all' && job.saved_at) {
                    const sweptDate = new Date(job.saved_at.replace(' ', 'T')); 
                    const diffHours = (now - sweptDate) / (1000 * 60 * 60);

                    if (sweptVal === 'today') {
                        passesSwept = sweptDate.toDateString() === now.toDateString();
                    } else if (sweptVal === 'past_24h') {
                        passesSwept = diffHours <= 24;
                    }
                }

                let passesSource = true;
                if (sourceVal !== 'all') {
                    const jobSource = (job.metadata?.source || job.source || '').toLowerCase();
                    passesSource = jobSource.includes(sourceVal.toLowerCase());
                }

                return passesPosted && passesSwept && passesSource;
            });

            renderTable(filtered);
        }

        async function updateJobStatus(jobId, newStatus) {
            try {
                const response = await fetch('/api/jobs/update-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: jobId, status: newStatus })
                });
                const res = await response.json();
                if (res.status === 'success') {
                    const job = allJobs.find(j => j.job_id === jobId);
                    if (job) {
                        job.status = newStatus;
                        job.applied_at = newStatus === 'applied' ? new Date().toISOString() : null;
                    }
                    filterAndRenderJobs();
                }
            } catch (err) {
                console.error('Error updating job status:', err);
            }
        }

        function confirmRevert(jobId) {
            if (confirm("⚠️ Are you sure you want to revert this status back to saved?")) {
                updateJobStatus(jobId, 'saved');
            }
        }

        function openNotesModal(jobId, currentNotes) {
            document.getElementById('modal-job-id').value = jobId;
            document.getElementById('modal-notes-input').value = currentNotes === 'Click to add personal notes to review in the future...' ? '' : currentNotes;
            const modal = document.getElementById('notes-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeNotesModal() {
            const modal = document.getElementById('notes-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function saveJobNotes() {
            const jobId = document.getElementById('modal-job-id').value;
            const notes = document.getElementById('modal-notes-input').value;
            try {
                const response = await fetch('/api/jobs/update-notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: jobId, notes: notes })
                });
                const res = await response.json();
                if (res.status === 'success') {
                    const job = allJobs.find(j => j.job_id === jobId);
                    if (job) job.personal_notes = notes;
                    closeNotesModal();
                    filterAndRenderJobs();
                }
            } catch (err) {
                console.error('Error saving notes:', err);
            }
        }

        function renderTable(jobs) {
            const tbody = document.getElementById('job-table-body');
            const stats = document.getElementById('stats');
            
            stats.innerText = `Showing ${jobs.length} of ${allJobs.length} ${currentCategory.replace('_', ' ')} Jobs`;

            if (jobs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500">No jobs match your filter criteria.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';

            jobs.forEach(job => {
                const fitScore = parseInt(job.fit_score) || 0;
                const fitColor = fitScore >= 50 ? 'text-emerald-400 bg-emerald-950/40 border-emerald-900' : 'text-amber-400 bg-amber-950/40 border-amber-900';
                
                const missingSkills = job.metadata && job.metadata.missing_skills ? job.metadata.missing_skills : [];
                const missingHtml = missingSkills.length > 0 
                    ? missingSkills.slice(0, 6).map(s => `<span class="px-1.5 py-0.5 rounded text-[10px] bg-red-950/50 text-red-300 border border-red-900/50">${s}</span>`).join(' ') 
                    : '<span class="text-slate-500 text-xs">None! Perfect match.</span>';

                const dateBadgeClass = getDateBadgeClass(job.date_posted);
                const formattedPostedDate = formatDateToUS(job.date_posted);
                const isApplied = (job.status || '').toLowerCase() === 'applied';
                
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-800/40 transition-colors';
                row.innerHTML = `
                    <td class="p-4 align-top">
                        <span class="px-2.5 py-1 rounded-md border font-semibold text-xs ${fitColor}">
                            ${fitScore}%
                        </span>
                    </td>
                    
                    <td class="p-4 align-top">
                        <div class="font-semibold text-slate-200 line-clamp-2 break-words">${job.title || 'Untitled'}</div>
                        
                        <div class="text-xs text-slate-400 mb-2 flex items-center justify-between">
                            <span>${job.company || 'Unknown Company'}</span>
                            <span class="px-2 py-0.5 rounded text-[11px] border font-mono ${dateBadgeClass}">
                                Posted: ${formattedPostedDate}
                            </span>
                        </div>

                        <!-- 1. AI Evaluation Insights Box (Read-only) -->
                        <div class="text-xs bg-slate-950/60 p-2.5 rounded-lg border border-slate-800/80 text-slate-300 italic mb-2">
                            💡 AI: "${job.ai_notes || 'No AI notes generated.'}"
                        </div>

                        <!-- 2. Clickable Personal Notes Box -->
                        <div onclick="openNotesModal('${job.job_id}', \`${(job.personal_notes || '').replace(/["']/g, "&#39;")}\`)" 
                             class="text-xs bg-emerald-950/20 p-2.5 rounded-lg border border-emerald-900/40 text-emerald-200 group cursor-pointer hover:border-emerald-600 transition-colors"
                             title="Click to add/edit personal notes">
                            <div class="flex justify-between items-center">
                                <span>📝 Personal Notes: "${job.personal_notes || 'Click to add personal notes to review in the future...'}"</span>
                                <span class="text-emerald-400 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-semibold">✏️ Edit</span>
                            </div>
                        </div>
                        
                        <div class="flex items-center space-x-2 text-xs text-gray-400 font-mono mt-2">
                            <span>ID: <code>${job.job_id}</code></span>
                            <button onclick="navigator.clipboard.writeText('${job.job_id}'); alert('Copied Job ID!');" 
                                    class="hover:text-white bg-gray-800 p-1.5 rounded border border-gray-700 flex items-center justify-center transition-colors"
                                    title="Copy ID">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <rect x="9" y="9" width="11" height="13" rx="1.5"></rect>
                                    <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                                </svg>
                            </button>
                        </div>
                    </td>
                    <td class="p-4 align-top text-xs space-y-1.5">
                        <div class="text-slate-300 font-medium">${job.location || 'Remote'}</div>
                        <div>
                            <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-800 text-slate-300 border border-slate-700">
                                ${job.employment_type || 'Unknown'}
                            </span>
                        </div>
                        <div>
                            <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${
                                job.sponsorship === 'Available' 
                                    ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' 
                                    : job.sponsorship === 'Not Available' 
                                    ? 'bg-rose-950 text-rose-300 border border-rose-800' 
                                    : 'bg-blue-950 text-blue-300 border border-blue-800'
                            }">
                                Visa: ${job.sponsorship || 'Not Mentioned'}
                            </span>
                        </div>
                        <div>
                            <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-800 text-slate-300 border border-slate-700">
                                Status: <span class="${isApplied ? 'text-emerald-400 font-bold' : 'text-slate-300'}">${job.status || 'saved'}</span>
                            </span>
                        </div>
                        ${isApplied && job.applied_at ? `
                            <div class="text-[10px] font-mono text-emerald-400">
                                Applied At: ${formatAppliedTimestamp(job.applied_at)}
                            </div>
                        ` : ''}
                        <div>
                            <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-800 text-slate-300 border border-slate-700 uppercase">
                                ${job.metadata?.source || 'JobSpy'}
                            </span>
                        </div>
                    </td>
                    <td class="p-4 align-top">
                        <div class="flex flex-wrap gap-1 max-w-xs">
                            ${missingHtml}
                        </div>
                    </td>
                    <td class="p-4 align-top">
                        <div class="flex flex-col gap-2">
                            <!-- Multi-location / Direct Link button -->
                            ${(job.metadata && job.metadata.locations && job.metadata.locations.length > 0) 
                                ? job.metadata.locations.map(loc => `
                                    <a href="${loc.url}" target="_blank" 
                                        class="bg-blue-600/80 hover:bg-blue-500 text-white font-medium px-2.5 py-1 rounded-md text-xs transition-colors shadow-sm inline-flex items-center gap-1 justify-center">
                                    📍 ${loc.city} ↗
                                    </a>
                                `).join('')
                                : `
                                    <a href="${job.job_url || '#'}" target="_blank" 
                                        class="bg-blue-600/80 hover:bg-blue-500 text-white font-medium px-2.5 py-1 rounded-md text-xs transition-colors shadow-sm inline-flex items-center gap-1 justify-center">
                                    📍 Link ↗
                                    </a>
                                `
                            }
                            
                            <!-- Autonomous Apply Trigger / Status Button -->
                            ${getAutoApplyButtonHtml(job)}

                            <!-- Manual Applied Fallback Button with Guard -->
                            ${!isApplied ? `
                                <button onclick="updateJobStatus('${job.job_id}', 'applied')" 
                                    class="bg-indigo-600/40 hover:bg-indigo-600 border border-indigo-500/50 text-indigo-200 hover:text-white font-medium px-3 py-1 rounded-lg text-xs transition-colors text-center">
                                    ✓ Mark Applied
                                </button>
                            ` : `
                                <button onclick="confirmRevert('${job.job_id}')" 
                                    class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium px-3 py-1 rounded-lg text-xs transition-colors text-center">
                                    ↺ Revert Status
                                </button>
                            `}
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function switchCategory(category) {
            fetchJobs(category);
            const auditBtn = document.getElementById('audit-btn');
            if (auditBtn) {
                auditBtn.href = `/audit?category=${category}`;
            }
        }

        function getAutoApplyButtonHtml(job) {
            const status = (job.apply_status || '').toUpperCase();
            if (status === 'QUEUED') {
                return `
                    <span class="bg-amber-950/70 border border-amber-500/50 text-amber-300 font-semibold px-2.5 py-1.5 rounded-lg text-xs flex items-center justify-center gap-1.5 animate-pulse">
                        ⏳ Queued
                    </span>
                `;
            } else if (status === 'PENDING_REVIEW') {
                return `
                    <a href="/applications" class="bg-cyan-950/80 hover:bg-cyan-900 border border-cyan-500/60 text-cyan-300 font-semibold px-2.5 py-1.5 rounded-lg text-xs flex items-center justify-center gap-1.5 transition-colors shadow-sm">
                        🛡️ In Review ↗
                    </a>
                `;
            } else if (status === 'SUBMITTED') {
                return `
                    <span class="bg-emerald-950/60 border border-emerald-600/40 text-emerald-300 font-medium px-2.5 py-1 rounded-lg text-xs flex items-center justify-center gap-1">
                        ✓ Auto-Applied
                    </span>
                `;
            } else if (status === 'FAILED') {
                return `
                    <button onclick="triggerAutoApply('${job.job_id}', this)" 
                        class="bg-rose-950/60 hover:bg-rose-900 border border-rose-600/50 text-rose-300 font-medium px-2.5 py-1.5 rounded-lg text-xs flex items-center justify-center gap-1 transition-colors"
                        title="Application failed. Click to re-queue.">
                        ⚠️ Retry Apply
                    </button>
                `;
            } else {
                return `
                    <button onclick="triggerAutoApply('${job.job_id}', this)" 
                        class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-2.5 py-1.5 rounded-lg text-xs transition-all shadow-sm flex items-center justify-center gap-1.5">
                        ⚡ Auto-Apply
                    </button>
                `;
            }
        }

        async function triggerAutoApply(jobId, btnElement) {
            btnElement.disabled = true;
            const originalContent = btnElement.innerHTML;
            btnElement.innerHTML = `
                <span class="inline-flex items-center gap-1">
                    <svg class="animate-spin h-3 w-3 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    Queuing...
                </span>
            `;
            try {
                const res = await fetch('/api/applications/queue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: jobId })
                });
                const data = await res.json();
                if (data.success) {
                    const job = allJobs.find(j => j.job_id === jobId);
                    if (job) job.apply_status = 'QUEUED';
                    filterAndRenderJobs();
                    updateReviewGateCount();
                } else {
                    alert('Failed to queue application: ' + (data.error || 'Unknown error'));
                    btnElement.disabled = false;
                    btnElement.innerHTML = originalContent;
                }
            } catch (err) {
                console.error('Error queueing application:', err);
                alert('Network error while queueing application.');
                btnElement.disabled = false;
                btnElement.innerHTML = originalContent;
            }
        }

        async function updateReviewGateCount() {
            try {
                const res = await fetch('/api/applications?status=ALL');
                const data = await res.json();
                const badge = document.getElementById('review-gate-badge');
                const pendingCount = (data.stats && data.stats.pending) || 0;
                if (badge) {
                    if (pendingCount > 0) {
                        badge.innerText = pendingCount;
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                }
            } catch (err) {
                console.error('Failed to fetch review gate count:', err);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchJobs('data_engineering');
            updateReviewGateCount();
        });
    </script>
</body>
</html>
