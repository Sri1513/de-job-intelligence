<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Application Review Gate — DE Job Intelligence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .navbar {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .metric-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .metric-value {
      font-size: 2rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .app-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      margin-bottom: 20px;
      padding: 20px;
    }
    .screenshot-preview {
      width: 100%;
      border-radius: 6px;
      border: 1px solid #475569;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .screenshot-preview:hover {
      transform: scale(1.02);
    }
    .badge-status {
      font-size: 0.85rem;
      padding: 6px 12px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4 mb-4">
  <a class="navbar-brand fw-bold text-info" href="/">DE Job Intelligence</a>
  <div class="navbar-nav ms-auto">
    <a class="nav-link" href="/"><i class="fa fa-list"></i> Jobs Feed</a>
    <a class="nav-link active" href="/applications"><i class="fa fa-shield-halved"></i> Review Gate</a>
    <a class="nav-link" href="/audit"><i class="fa fa-chart-pie"></i> Skill Audit</a>
    <a class="nav-link" href="/skills-analytics"><i class="fa fa-chart-line"></i> Demographics</a>
    <a class="nav-link" href="/whatsapp-alerts"><i class="fa fa-paper-plane"></i> WhatsApp Alerts</a>
  </div>
</nav>

<div class="container-fluid px-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1"><i class="fa fa-user-check text-info"></i> Autonomous Application Review Gate</h2>
      <p class="text-secondary mb-0">Human-in-the-loop review of autofilled applications before final submission.</p>
    </div>
    <div>
      <select id="statusFilter" class="form-select bg-dark text-white border-secondary" onchange="fetchApplications()">
        <option value="ALL">All Application States</option>
        <option value="PENDING_REVIEW" selected>Pending Review</option>
        <option value="QUEUED">Queued</option>
        <option value="SUBMITTED">Submitted</option>
        <option value="FAILED">Failed</option>
      </select>
    </div>
  </div>

  <!-- Metric Badges -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="metric-card">
        <div class="text-secondary small fw-semibold">PENDING REVIEW</div>
        <div class="metric-value text-warning" id="countPending">0</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="metric-card">
        <div class="text-secondary small fw-semibold">QUEUED</div>
        <div class="metric-value text-info" id="countQueued">0</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="metric-card">
        <div class="text-secondary small fw-semibold">SUBMITTED</div>
        <div class="metric-value text-success" id="countSubmitted">0</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="metric-card">
        <div class="text-secondary small fw-semibold">FAILED</div>
        <div class="metric-value text-danger" id="countFailed">0</div>
      </div>
    </div>
  </div>

  <!-- Card List -->
  <div id="applicationsContainer">
    <div class="text-center py-5 text-secondary">
      <div class="spinner-border text-info" role="status"></div>
      <p class="mt-2">Loading applications...</p>
    </div>
  </div>
</div>

<script>
async function fetchApplications() {
  const filter = document.getElementById("statusFilter").value;
  const container = document.getElementById("applicationsContainer");
  
  try {
    const res = await fetch(`/api/applications?status=${filter}`);
    const data = await res.json();
    
    // Update metric counters
    document.getElementById("countPending").innerText = data.stats.pending || 0;
    document.getElementById("countQueued").innerText = data.stats.queued || 0;
    document.getElementById("countSubmitted").innerText = data.stats.submitted || 0;
    document.getElementById("countFailed").innerText = data.stats.failed || 0;

    if (!data.applications || data.applications.length === 0) {
      container.innerHTML = `<div class="text-center py-5 text-secondary"><i class="fa fa-inbox fa-3x mb-3"></i><p>No applications found matching status '${filter}'.</p></div>`;
      return;
    }

    container.innerHTML = data.applications.map(app => {
      const badgeClass = {
        'PENDING_REVIEW': 'bg-warning text-dark',
        'QUEUED': 'bg-info text-dark',
        'SUBMITTED': 'bg-success',
        'FAILED': 'bg-danger'
      }[app.apply_status] || 'bg-secondary';

      const screenshotHtml = app.screenshot_url 
        ? `<a href="${app.screenshot_url}" target="_blank">
            <img src="${app.screenshot_url}" alt="Screenshot verification" class="screenshot-preview shadow-sm" 
                 onerror="this.style.display='none'; this.nextElementSibling.classList.remove('d-none');" />
            <div class="d-none p-4 border border-secondary rounded text-center text-muted">
                <i class="fa fa-triangle-exclamation fa-2x mb-2 text-warning"></i><br>
                Screenshot artifact missing or could not be loaded.
            </div>
           </a>`
        : `<div class="p-4 border border-secondary rounded text-center text-muted" style="min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
             <i class="fa fa-image-slash fa-2x mb-2 text-secondary"></i>
             <span>No screenshot artifact captured.</span>
             <span class="small text-secondary mt-1">${app.apply_status === 'FAILED' ? 'Application failed before reaching form.' : 'Awaiting worker execution.'}</span>
           </div>`;

      return `
        <div class="app-card">
          <div class="row g-4">
            <div class="col-md-6 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h4 class="fw-bold mb-0 text-white">${app.title}</h4>
                  <span class="badge ${badgeClass} badge-status">${app.apply_status}</span>
                </div>
                <h6 class="text-info mb-3">${app.company} &bull; <span class="text-secondary">${app.location}</span></h6>
                
                <p class="mb-2"><strong>Target Link:</strong> <a href="${app.job_url}" target="_blank" class="text-decoration-none text-info">${app.job_url} <i class="fa fa-arrow-up-right-from-square small"></i></a></p>
                <p class="mb-2"><strong>Fit Score:</strong> <span class="badge bg-dark border border-secondary">${app.fit_score}%</span></p>
                <p class="mb-3"><strong>Timestamp:</strong> <span class="text-secondary">${app.applied_at || 'Not yet processed'}</span></p>
                
                <div class="p-3 bg-dark rounded border border-secondary mb-3">
                  <div class="small fw-bold text-secondary mb-1">Agent Notes:</div>
                  <div class="small font-monospace text-light">${app.apply_notes}</div>
                </div>
              </div>

              <div class="d-flex gap-2">
                <button class="btn btn-success btn-sm px-3" onclick="updateStatus('${app.job_id}', 'SUBMITTED')">
                  <i class="fa fa-check"></i> Mark as Submitted
                </button>
                <button class="btn btn-outline-info btn-sm px-3" onclick="updateStatus('${app.job_id}', 'QUEUED')">
                  <i class="fa fa-rotate-right"></i> Re-queue
                </button>
                <button class="btn btn-outline-danger btn-sm px-3" onclick="updateStatus('${app.job_id}', 'DISMISSED')">
                  <i class="fa fa-times"></i> Dismiss
                </button>
              </div>
            </div>

            <div class="col-md-6">
              <div class="small fw-semibold text-secondary mb-2">Verification Artifact:</div>
              ${screenshotHtml}
            </div>
          </div>
        </div>
      `;
    }).join("");

  } catch (err) {
    container.innerHTML = `<div class="alert alert-danger">Error loading applications: ${err.message}</div>`;
  }
}

async function updateStatus(jobId, status) {
  const notes = prompt(`Optional note for transitioning ${jobId} to ${status}:`, "");
  const res = await fetch("/api/applications/update-status", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ job_id: jobId, status: status, notes: notes })
  });
  if (res.ok) {
    fetchApplications();
  } else {
    alert("Failed to update status.");
  }
}

document.addEventListener("DOMContentLoaded", fetchApplications);
</script>

</body>
</html>
