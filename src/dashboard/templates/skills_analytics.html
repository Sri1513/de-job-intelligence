<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Skills Demographics & Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-emerald-400">📊 Skills Market Demographics</h1>
                <p class="text-sm text-slate-400">Explore all technical requirements extracted from job postings</p>
            </div>
            <a href="/audit?category={{ current_category }}" class="px-4 py-2 rounded-lg font-semibold text-sm transition-colors bg-slate-800 text-slate-200 hover:bg-slate-700">
                ← Back to Skill Audit
            </a>
        </header>

        <!-- Filters & Range Buttons -->
        <div class="flex justify-between items-center flex-wrap gap-4 mb-6 bg-slate-900 p-4 rounded-xl border border-slate-800">
            <div class="flex items-center gap-3">
                <span class="text-xs font-semibold text-slate-400">CATEGORY:</span>
                <span class="px-3 py-1 rounded-full text-xs font-bold uppercase bg-emerald-950 text-emerald-300 border border-emerald-800">
                    {{ current_category.replace('_', ' ') }}
                </span>
            </div>

            <!-- Limit Selection Buttons -->
            <div class="flex items-center space-x-2">
                <span class="text-xs font-semibold text-slate-400 mr-2">VIEW RANGE:</span>
                <button onclick="changeLimit('10')" id="btn-10" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white transition-colors">Top 10</button>
                <button onclick="changeLimit('20')" id="btn-20" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:text-white transition-colors">Top 20</button>
                <button onclick="changeLimit('30')" id="btn-30" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:text-white transition-colors">Top 30</button>
                <button onclick="changeLimit('all')" id="btn-all" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:text-white transition-colors">All Unique Skills</button>
            </div>
        </div>

        <!-- Chart Container Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
            <div id="chart-wrapper" class="relative">
                <canvas id="skillsChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let currentLimit = '10';
        let skillsChartInstance = null;

        async function loadChartData(limit = '10') {
            currentLimit = limit;
            
            // Update button styles
            ['10', '20', '30', 'all'].forEach(val => {
                const btn = document.getElementById(`btn-${val}`);
                if (val === limit) {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white transition-colors";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:text-white transition-colors";
                }
            });

            try {
                const response = await fetch(`/api/skills-demographics?category={{ current_category }}&limit=${limit}`);
                const data = await response.json();

                const ctx = document.getElementById('skillsChart').getContext('2d');
                
                if (skillsChartInstance) {
                    skillsChartInstance.destroy();
                }

                const wrapper = document.getElementById('chart-wrapper');
                const isAll = (limit === 'all');

                // If 'all' is selected, make it a vertical-scrolling horizontal bar chart
                if (isAll) {
                    wrapper.style.height = `${Math.max(600, data.labels.length * 28)}px`;
                } else {
                    wrapper.style.height = '500px';
                }

                skillsChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Job Postings Demanding Skill',
                            data: data.counts,
                            backgroundColor: 'rgba(16, 185, 129, 0.75)',
                            borderColor: 'rgba(16, 185, 129, 1)',
                            borderWidth: 1,
                            borderRadius: 4
                        }]
                    },
                    options: {
                        indexAxis: isAll ? 'y' : 'x', // Flips to horizontal bars when viewing all unique skills
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: {
                                beginAtZero: true,
                                ticks: { color: '#94a3b8' },
                                grid: { color: '#1e293b' }
                            },
                            y: {
                                ticks: { color: '#94a3b8' },
                                grid: { color: '#1e293b' }
                            }
                        }
                    }
                });
            } catch (err) {
                console.error("Failed to load chart demographics:", err);
            }
        }

        function changeLimit(limit) {
            loadChartData(limit);
        }

        document.addEventListener("DOMContentLoaded", () => loadChartData('10'));
    </script>
</body>
</html>
