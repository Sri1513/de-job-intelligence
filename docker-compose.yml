services:
  postgres:
    # Sprint 1, Batch 3: pgvector image, NOT plain postgres:16-alpine.
    # The pgvector/pgvector:pg16 image is the official PostgreSQL 16 image
    # with the pgvector extension preinstalled (there is no `latest` tag;
    # `pg16` tracks the newest pgvector for Postgres 16). Same PG major
    # version, same data-directory format — the postgres_data volume is
    # reused as-is, so no data migration is needed. One difference: this
    # image is Debian-based, the old one was Alpine; that only changes
    # the container OS, not the data.
    # WHY: the Sprint 1 chunk tables (migration 008, Batch 4) need
    # `embedding vector(384)` columns, and the `vector` type only exists
    # once this image is running. The extension itself is enabled per
    # database by migration 008 (CREATE EXTENSION IF NOT EXISTS vector);
    # this change only makes it AVAILABLE.
    # SAFETY: back up BEFORE merging this — merging triggers the CI
    # deploy, which recreates the postgres container with this image.
    # See docs/pgvector-image-swap.md for the backup/verify steps.
    image: pgvector/pgvector:pg16
    container_name: de-job-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-job_scout_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mcp-server:
    build: .
    container_name: de-job-mcp
    # Tee stdout to a file so the dashboard's admin API can serve log tails.
    command: ["sh", "-c", "uvicorn src.protocols.app:app --host 0.0.0.0 --port 8000 2>&1 | tee /app/logs/mcp.log"]
    env_file: .env
    environment:
      # Residential egress for scraping: forward proxy on the user's laptop
      # over Tailscale (e.g. http://100.68.109.36:8888). Empty = scrape direct.
      - SCRAPER_PROXY_URL=${SCRAPER_PROXY_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:rw
      - ./data/screenshots:/app/data/screenshots
      - ./data/oauth:/app/data/oauth
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped

  dashboard:
    build: .
    container_name: de-job-dashboard
    command: ["sh", "-c", "uvicorn src.dashboard.app:app --host 0.0.0.0 --port 5001 2>&1 | tee /app/logs/dashboard.log"]
    env_file: .env
    environment:
      # In compose the MCP server is reachable by service name.
      - MCP_HEALTH_URL=http://mcp-server:8000/health
      - MARKET_CHAT_MCP_URL=http://mcp-server:8000/public/mcp
    ports:
      - "5001:5001"
    depends_on:
      - postgres
    volumes:
      - ./data/screenshots:/app/data/screenshots:ro
      - ./logs:/app/logs
      - ./config:/app/config:ro
    restart: unless-stopped
  
  apply-worker:
    build: .
    container_name: de-job-apply-worker
    command: ["sh", "-c", "python -m src.workers.apply_worker 2>&1 | tee /app/logs/apply-worker.log"]
    shm_size: "2gb"
    env_file: .env
    environment:
      - DB_HOST=de-job-db
      - HEADLESS=true
      - CHROME_PATH=/usr/bin/chromium
    depends_on:
      - postgres
    volumes:
      - ./data/screenshots:/app/data/screenshots:rw
      - ./logs:/app/logs
      - ./config:/app/config:rw
      # Persistent browser profiles (LinkedIn/Indeed sessions). Named volume so
      # sessions survive `docker compose down` and redeploys; never baked into images.
      - browser_profiles:/app/data/browser_profiles:rw
    restart: unless-stopped

volumes:
  postgres_data:
  browser_profiles: