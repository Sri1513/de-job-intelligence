version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: de-job-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-job_scout_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mcp-server:
    build: .
    container_name: de-job-mcp
    command: uvicorn src.protocols.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:rw
      - ./data/screenshots:/app/data/screenshots
      - ./config:/app/config
    restart: unless-stopped

  dashboard:
    build: .
    container_name: de-job-dashboard
    command: uvicorn src.dashboard.app:app --host 0.0.0.0 --port 5001
    env_file: .env
    ports:
      - "5001:5001"
    depends_on:
      - postgres
    volumes:
      - ./data/screenshots:/app/data/screenshots:ro
      - ./config:/app/config:ro
    restart: unless-stopped
  
  apply-worker:
    build: .
    container_name: de-job-apply-worker
    command: python -m src.workers.apply_worker
    shm_size: "2gb"
    env_file: .env
    environment:
      - DB_HOST=de-job-db
      - HEADLESS=true
      - CHROME_PATH=/usr/bin/chromium
    depends_on:
      - postgres
    volumes:
      - ./data/screenshots:/app/data/screenshots:rw
      - ./config:/app/config:rw
      # Persistent browser profiles (LinkedIn/Indeed sessions). Named volume so
      # sessions survive `docker compose down` and redeploys; never baked into images.
      - browser_profiles:/app/data/browser_profiles:rw
    restart: unless-stopped

volumes:
  postgres_data:
  browser_profiles: