version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: de-job-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-job_scout_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mcp-server:
    build: .
    container_name: de-job-mcp
    command: uvicorn src.protocols.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:rw
    restart: unless-stopped

  dashboard:
    build: .
    container_name: de-job-dashboard
    command: uvicorn src.dashboard.app:app --host 0.0.0.0 --port 5001
    env_file: .env
    ports:
      - "5001:5001"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: